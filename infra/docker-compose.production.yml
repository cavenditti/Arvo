name: arvo-production

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: arvo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: arvo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The image briefly starts a temporary postmaster while initializing a new
      # volume. Only report healthy once the final PID 1 postmaster is running.
      test: ["CMD-SHELL", "test \"$$(head -n 1 /var/lib/postgresql/data/postmaster.pid)\" = \"1\" && pg_isready -U arvo -d arvo"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    image: arvo-production-backend
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://arvo:${POSTGRES_PASSWORD}@db:5432/arvo
      DATABASE_MAX_CONNECTIONS: 10
      JWT_SECRET: ${MEDIA_JWT_SECRET:?set MEDIA_JWT_SECRET}
      BETTER_AUTH_ISSUER: https://app.arvo.farm
      BETTER_AUTH_JWKS_URL: http://auth:3000/api/auth/jwks
      BETTER_AUTH_AUDIENCE: https://api.arvo.farm
      ALLOWED_ORIGINS: https://app.arvo.farm,https://arvo.farm
      UPLOAD_DIR: /var/lib/arvo/uploads
      STORE_DIR: /var/lib/arvo/store
      TILE_CACHE_DIR: /var/lib/arvo/tiles
      PORT: 8787
      RUST_LOG: arvo_api=info,tower_http=info
    volumes:
      - arvo-data:/var/lib/arvo
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8787/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  plant-detect:
    build:
      context: ../services/plant-detect
      args:
        INSTALL_ML: "1"
    restart: unless-stopped
    environment:
      STORE_DIR: /var/lib/arvo/store
      PORT: 8788
      # DeepForest and raster processing are CPU/RAM intensive. The production host has one
      # detector process so a large orthophoto cannot starve the API and database.
      WEB_CONCURRENCY: 1
      PLANT_DETECT_ALLOW_ABS_PATHS: 0
      PLANT_DETECT_ML: auto
      PLANT_DETECT_ML_MODEL: weecology/deepforest-tree
    volumes:
      - arvo-data:/var/lib/arvo:ro
      - plant-detect-cache:/var/cache/plant-detect

  worker:
    image: arvo-production-backend
    build:
      context: ../backend
    restart: unless-stopped
    command: ["arvo-worker", "run", "--interval-secs", "5"]
    environment:
      DATABASE_URL: postgres://arvo:${POSTGRES_PASSWORD}@db:5432/arvo
      DATABASE_MAX_CONNECTIONS: 4
      STORE_DIR: /var/lib/arvo/store
      PLANT_DETECT_URL: http://plant-detect:8788
      PLANT_DETECT_TIMEOUT_S: 600
      RUST_LOG: arvo_worker=info
    volumes:
      - arvo-data:/var/lib/arvo
    depends_on:
      db:
        condition: service_healthy
      plant-detect:
        condition: service_healthy

  auth:
    build:
      context: ../auth-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://arvo:${POSTGRES_PASSWORD}@db:5432/arvo
      DATABASE_MAX_CONNECTIONS: 5
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://app.arvo.farm
      ARVO_API_AUDIENCE: https://api.arvo.farm
      BETTER_AUTH_TRUSTED_ORIGINS: arvo://,arvo://*,https://app.arvo.farm
      SCW_TEM_API_KEY: ${SCW_TEM_API_KEY:?set SCW_TEM_API_KEY}
      SCW_PROJECT_ID: 405e5323-69ec-4189-9e01-444937eb0b16
      SCW_TEM_REGION: fr-par
      SCW_TEM_SENDER: no-reply@arvo.farm
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        EXPO_PUBLIC_API_URL: https://api.arvo.farm
        EXPO_PUBLIC_AUTH_URL: https://app.arvo.farm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      auth:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres-data:
  arvo-data:
  plant-detect-cache:
  caddy-data:
  caddy-config:
